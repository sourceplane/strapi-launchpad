apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The LaunchPad marketing site (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment; R2 + Durable Objects as the Next.js cache for its Strapi reads; the template's own sample content until a Strapi project is connected)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # INFRA BEFORE APP. The R2 bucket is the Worker's incremental cache, bound
  # by name, and the name is rendered into its config during the build from
  # the wiring document the cloudflare-r2 root lease-publishes after its
  # apply. A job resolves its secrets when it STARTS, so on a merge to main
  # this deploy waits for that environment's apply (enforced) and the document
  # is there; a pull request deploys nothing, so nothing on one waits
  # (advisory). The Durable Objects (tag cache, revalidation queue) need no
  # root — the Worker exports their classes and the migration creates them on
  # deploy.
  dependsOn:
    - component: cloudflare-r2
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
  secretEnv:
    WIRING_CLOUDFLARE_R2_STAGE: "secret://strapi-launchpad/strapi-launchpad/stage/WIRING_CLOUDFLARE_R2"
    WIRING_CLOUDFLARE_R2_PROD: "secret://strapi-launchpad/strapi-launchpad/prod/WIRING_CLOUDFLARE_R2"
  # The Strapi project, connected after the build by its owner: its public URL
  # (https://<project>.strapiapp.com), per environment. The build inlines it
  # as the template's NEXT_PUBLIC_API_URL (next.config.ts) — server and
  # browser code both read it — so it is build env, not a Worker secret, and
  # it is not a credential. BEST-EFFORT, wire-now-seed-later: a key nobody has
  # stored yet is skipped when the job resolves its secrets, and a build
  # without it is the site on its bundled sample content (the template's own
  # seed) with a "connect your Strapi project" bar — so a fresh product
  # deploys and serves before its owner has a Strapi project at all. The
  # preview secret is read at request time: a Worker secret the owner sets
  # (README → Connecting Strapi).
  optionalSecretEnv:
    STRAPI_URL: "secret://strapi-launchpad/strapi-launchpad/{{ .environment }}/STRAPI_URL"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: strapi-launchpad-web-{dev,stage,prod}. The rendered
    # wrangler.jsonc names the same Worker (its self-reference binding needs it).
    workerName: strapi-launchpad-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # Render this environment's wrangler config, then build. stage and prod
    # render from the wiring document their cloudflare-r2 apply published
    # (secretEnv above, resolved before the job's first step); dev, which no
    # root applies to and which only verifies, renders from the committed
    # fixture. The committed wrangler.jsonc (the fixture render) is what the
    # composition's verify-app-structure step finds before this runs. The
    # build is for this environment's origin: NEXT_PUBLIC_SITE_URL (the
    # metadataBase relative Open Graph images resolve against) is the
    # environment's SITE_URL (intent.yaml), else its workers.dev URL.
    buildCommand: node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components cloudflare-r2 --env "${ORUN_ENVIRONMENT}" --fixture wiring.fixture.json --fixture-envs dev && NEXT_PUBLIC_SITE_URL="${SITE_URL:-https://strapi-launchpad-web-${ORUN_ENVIRONMENT}.your-workers-subdomain.workers.dev}" pnpm exec turbo run build --filter=@app/web

    # Smoke: `/` redirects to the visitor's locale and the English home page
    # renders the site's navigation (its "Pricing" link: in the sample and in
    # the template's seed a connected Strapi starts from — not the site's
    # name, which is the owner's to change and HTML-escaped when it carries an
    # `&` or `'`); and the Worker itself answers /api/health, which no static
    # file can. Buffered before grep so an early match cannot SIGPIPE curl.
    smokeCommand: 'html=$(curl -sfL "${DEPLOYED_URL}/") && echo "${html}" | grep -q "/en/pricing" && health=$(curl -sf "${DEPLOYED_URL}/api/health") && echo "${health}" | grep -q "\"ok\":true"'
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
