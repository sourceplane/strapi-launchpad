# The strapi-launchpad card: what the console's Blueprints page renders and the
# platform's bootstrap door consumes.
#
# THIS FILE IS NOT THE BUILD. `spec.bootstrap.blueprint` names the build
# document — `repo-blueprint.yaml`, whose phases a runner places. This card is
# what an operator reads and fills in before pressing Build, and
# `testing/manifest.test.sh` compares every list below to the document that
# actually does the thing, not to a copy of itself.
#
# The division of labour with the registry is strict: the registry (orun-cloud
# `infra/baselines-registry/baselines.yaml`) owns identity and commerce — id,
# visibility, tier, the pinned tag. This file owns the build contract. Neither
# restates the other, which is why there is no `tag` here: this file is
# fetched AT the tag the registry pins.
apiVersion: orun.io/v1
kind: Blueprint
metadata:
  name: strapi-launchpad
  displayName: LaunchPad — a Strapi-powered Next.js marketing site on Cloudflare Workers
  description: >
    Vercel's LaunchPad (Next.js × Strapi Starter) as a product of its own:
    the LaunchPad marketing site — a home page built from Strapi's dynamic
    zones, pricing, FAQ and contact pages, a blog and a product catalogue,
    in English and French, with draft mode for Strapi's preview — built by
    OpenNext into one Cloudflare Worker with Static Assets. Every Strapi
    read is cached with "use cache" in an R2 bucket Terraform provisions per
    environment, with its tag cache and revalidation queue in Durable
    Objects. CI applies the bucket and deploys the site to stage and prod on
    merge. It goes live before any Strapi project exists, on the template's
    own seed as sample content, and reads yours once you set its URL. One
    provider, one consent, one landing.
  tags: [marketing, cms, strapi, i18n, r2, cloudflare, nextjs]
spec:
  source:
    repo: sourceplane/strapi-launchpad
    # No `tag`. The registry pins it; this file is fetched at it.

  # ── What the operator reads first ────────────────────────────────────────
  overview:
    lede: >
      A Strapi-powered marketing site on Cloudflare: LaunchPad's Next.js
      front end on one Worker, every Strapi read cached in R2. It deploys on
      the template's own sample content before your Strapi project exists;
      set your project's URL and it renders your pages, posts and products.
    architecture:
      - layer: Edge
        items: [web]
      - layer: Content
        items: [Strapi (your project - connected after the build)]
      - layer: Cache
        items: [R2 (cloudflare-r2), Durable Objects (tag cache and queue)]
      - layer: Delivery
        items: [GitHub Actions, OpenNext, Terraform]
    outcome:
      - Live on stage and prod, in one landing
      - The R2 cache bucket applied before the Worker that binds it
      - Live on sample content before a Strapi project is connected
      - Strapi reads cached at the edge
      - Every merge redeploys, smoke-tested
      - Its own CI from the first commit

  requires:
    # Cloudflare is the only provider connection a bootstrap needs. GitHub
    # arrives as the App installation plus the repo link, not as a
    # connection row. Strapi is not a provider the platform brokers: the
    # site deploys on its bundled sample content, and its owner connects a
    # Strapi project after the build by setting its URL as an Orun secret —
    # the product's README, "Connecting Strapi" — so the card asks for
    # nothing of Strapi's.
    integrations: [github, cloudflare]
    apiKeyRole: admin          # secret writes need the admin floor

  # Every input is collected by the console: keys are lowercase (the
  # platform's reader refuses anything else), every one carries the `pattern`
  # its value is checked against before Continue, and a value the console
  # already holds says so with `from`. repo-blueprint.yaml declares the same
  # names; `repoPrivate`, `orunWorkspace` and `epicSlug` are build inputs with
  # defaults (or filled from the build's workspace) and are not asked.
  #
  # NOR IS THE DOMAIN. The site goes live on workers.dev, and a domain is an
  # owner's step after the bootstrap: `productdomain` defaults to empty, the
  # rebrand writes the reserved placeholder `<reponame>.example.com` where
  # the domain goes, and the site's README ("Custom domain") says how to set
  # it. Nothing that needs a domain is removed — it waits for one.
  inputs:
    - key: reponame
      label: Repo name
      pattern: "^[a-z][a-z0-9-]{1,38}$"
      # The operator picked the repository; its name IS this value.
      from: repo.name
    - key: productname
      label: Site name
      pattern: "^[A-Za-z0-9][A-Za-z0-9 .,'&-]{1,48}$"
      help: The name visitors see — the logo, the sign-up heading, the default page title.
      example: Acme Launch
    - key: githuborg
      label: GitHub organisation
      pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
      help: The GitHub org or user the site's repository is created under.
      # DERIVED FROM THE CHOSEN REPOSITORY: its owner IS this value. Declared
      # because repo-blueprint.yaml requires it — a build may declare more
      # inputs than this card, but not require one nobody supplies.
      from: repo.owner
    - key: subdomain
      label: workers.dev subdomain
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      help: The workers.dev subdomain of the Cloudflare account the site deploys into.
      example: acme
      # READ FROM THE CLOUDFLARE CONNECTION, not asked. The subdomain belongs
      # to the account the same way its id does, and there is exactly one
      # right answer — a typed one could only be wrong, and wrong showed up
      # after deploy, in the deploy's smoke, the phase probes and the verify
      # URLs below. The integration reads it from Cloudflare at connect and on
      # its hourly health check; the bootstrap door fills this input from the
      # connection the build is BOUND to, the same one CLOUDFLARE_ACCOUNT_ID
      # and the deploy tokens mint from, so all three name one account. The
      # console renders no field for it. An account with no workers.dev
      # subdomain refuses the build at the door, naming the fix, before
      # anything is created.
      from: connection.cloudflare.workersSubdomain

  # ── PREVIEW ONLY. repo-blueprint.yaml's one `orun.integrations/reconcile@v1`
  # hook (`secrets`) mints these, brokered, during 01-product. ──────────────
  # Transcribed from that hook's own `secrets:` entries (each key and its
  # template), in its order, so testing/manifest.test.sh compares this list
  # to the document that mints them. The console renders them read-only: no
  # credential is ever typed, shown or stored. Keys that already exist are
  # kept. The bucket names are not here: they are not credentials, and the
  # bucket's own apply publishes them. Nor is anything of Strapi's: the
  # platform does not broker it, and the site needs none to go live.
  secrets:
    - key: CLOUDFLARE_API_TOKEN
      provider: cloudflare
      template: workers-deploy
      why: Deploys the site's Worker and its static assets
    - key: CLOUDFLARE_R2_TOKEN
      provider: cloudflare
      template: r2-data
      why: Applies the R2 cache bucket — the deploy token deliberately carries no R2
    - key: CLOUDFLARE_ACCOUNT_ID
      provider: cloudflare
      template: account-id
      why: Connection fact, not a secret
      fact: true

  # ── PREVIEW ONLY. repo-blueprint.yaml's run-level `hooks.preInstantiate`
  # opens these — the epic, every milestone in this order, every task — before
  # the first phase places. Idempotent by identity, so a re-run finds what it
  # made before.
  programme:
    epicSlug: strapi-launchpad-baselining      # = repo-blueprint.yaml's `epicSlug` default
    epicName: "Marketing site baselining — {productname}"
    milestones:
      # The whole product is one landing (01-product): the repository, the R2
      # root, the site and its tests are one pull request and one
      # convergence.
      - name: 01-product
      - name: 02-docs

  bootstrap:
    # THE BUILD DOCUMENT. There is no umbrella workflow and no agent brief:
    # every phase is declared in it and orun runs it.
    blueprint: repo-blueprint.yaml
    # Summed from the phases' expectedMinutes (14 + 1). An estimate until a
    # bootstrap measures it: no build of this baseline has been timed.
    expectedMinutes: 15
    tokenChannel: ORUN_TOKEN_FILE   # how a runner hands over its refreshed token
  verify:
    urls:
      - "https://{reponame}-web-{env}.{subdomain}.workers.dev"
    envs: [stage, prod]
